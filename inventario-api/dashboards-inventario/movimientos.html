<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDA - Dashboard de Movimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Cargamos Chart.js desde CDN para la gráfica de barras -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .badge-entrada { background-color: #d1e7dd; color: #0f5132; font-weight: bold; }
        .badge-salida { background-color: #f8d7da; color: #842029; font-weight: bold; }
        .chart-container { background: #ffffff; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2> Auditoría e Historial de Movimientos (Fase 4)</h2>
            <span class="badge bg-primary fs-6">Módulo Trazabilidad</span>
        </div>

        <!-- Tarjetas de Resumen Rápido -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Total Entradas</h5>
                        <p class="card-text fs-3" id="total-entradas">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-warning mb-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Total Salidas</h5>
                        <p class="card-text fs-3" id="total-salidas">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gráfica Analítica -->
        <div class="row mb-4">
            <div class="col-md-6 mx-auto">
                <div class="chart-container shadow-sm">
                    <h5 class="text-center mb-3">Comparativa de Operaciones</h5>
                    <canvas id="graficaMovimientos"></canvas>
                </div>
            </div>
        </div>

        <!-- Buscador de Auditoría / Trazabilidad QR -->
        <div class="mb-4">
            <input type="text" id="buscador" class="form-control form-control-lg shadow-sm" placeholder="🔍 Buscar por QR, ID, Material o Tipo (Entrada/Salida)...">
        </div>

        <!-- Tabla de Movimientos -->
        <div class="card shadow-sm mb-5">
            <div class="card-body p-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID Movimiento</th>
                            <th>ID Material</th>
                            <th>Materia Prima</th>
                            <th>Tipo</th>
                            <th>Cantidad</th>
                            <th>Fecha</th>
                            <th>Código QR Asociado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-movimientos">
                        <!-- Se inyecta dinámicamente desde movimientos.json -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let conteoEntradas = 0;
        let conteoSalidas = 0;

        // 1. Cargar y procesar datos de movimientos.json
        fetch('movimientos.json')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('tabla-movimientos');
                
                data.forEach(mov => {
                    if (mov.tipo.toLowerCase() === 'entrada') {
                        conteoEntradas++;
                    } else if (mov.tipo.toLowerCase() === 'salida') {
                        conteoSalidas++;
                    }

                    const fila = document.createElement('tr');
                    const badgeClass = mov.tipo.toLowerCase() === 'entrada' ? 'badge-entrada' : 'badge-salida';

                    fila.innerHTML = `
                        <td><code>${mov.id_movimiento}</code></td>
                        <td><code>${mov.id_material}</code></td>
                        <td><strong>${mov.material}</strong></td>
                        <td><span class="badge ${badgeClass}">${mov.tipo}</span></td>
                        <td>${mov.cantidad}</td>
                        <td>${mov.fecha}</td>
                        <td><code>${mov.qr_codigo}</code></td>
                    `;
                    tbody.appendChild(fila);
                });

                // Actualizar tarjetas de resumen
                document.getElementById('total-entradas').innerText = conteoEntradas;
                document.getElementById('total-salidas').innerText = conteoSalidas;

                // 2. Inicializar Gráfica con Chart.js
                const ctx = document.getElementById('graficaMovimientos').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['Entradas', 'Salidas'],
                        datasets: [{
                            label: 'Cantidad de Registros',
                            data: [conteoEntradas, conteoSalidas],
                            backgroundColor: ['#198754', '#ffc107'],
                            borderColor: ['#146c43', '#d39e00'],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { beginAtZero: true, ticks: { stepSize: 1 } }
                        }
                    }
                });
            })
            .catch(error => console.error('Error al cargar movimientos:', error));

        // 3. Filtrado dinámico (Trazabilidad)
        document.getElementById('buscador').addEventListener('input', function(e) {
            const textoBusqueda = e.target.value.toLowerCase();
            const filas = document.querySelectorAll('#tabla-movimientos tr');
            
            filas.forEach(fila => {
                const contenidoFila = fila.textContent.toLowerCase();
                if (contenidoFila.includes(textoBusqueda)) {
                    fila.style.display = '';
                } else {
                    fila.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
