{% extends "base.html" %}
{% block title %}{{ "Editar producto" if producto else "Nuevo producto" }}{% endblock %}

{% block content %}
<h1 class="h3 mb-4">{{ "Editar producto" if producto else "Nuevo producto" }}</h1>

<form method="post"
      action="{{ '/productos/' ~ producto.id_producto ~ '/editar' if producto else '/productos/nuevo' }}">
    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" name="nombre" class="form-control"
               value="{{ producto.nombre if producto else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Descripción</label>
        <textarea name="descripcion" class="form-control">{{ producto.descripcion if producto else '' }}</textarea>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">Unidad de medida</label>
            <input type="text" name="unidad_medida" class="form-control"
                   value="{{ producto.unidad_medida if producto else '' }}" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" step="0.01" name="cantidad" class="form-control"
                   value="{{ producto.cantidad if producto else '' }}" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">Precio unitario</label>
            <input type="number" step="0.01" name="precio_unitario" class="form-control"
                   value="{{ producto.precio_unitario if producto else '' }}" required>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">Estado</label>
            <select name="estado" class="form-select">
                <option value="disponible" {% if producto and producto.estado == "disponible" %}selected{% endif %}>Disponible</option>
                <option value="agotado" {% if producto and producto.estado == "agotado" %}selected{% endif %}>Agotado</option>
                <option value="descontinuado" {% if producto and producto.estado == "descontinuado" %}selected{% endif %}>Descontinuado</option>
            </select>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">Fecha de producción</label>
            <input type="date" name="fecha_produccion" class="form-control"
                   value="{{ producto.fecha_produccion if producto else '' }}">
        </div>
    </div>
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="/productos" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
